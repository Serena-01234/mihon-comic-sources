name: Build and publish extension repo

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/keiyoushi/extensions-source.git
  # 固定上游构建系统版本，避免上游改动导致构建漂移
  UPSTREAM_SHA: ef952a64df831c33c29c276d9c283b4cd7633ce1
  UPSTREAM_DIR: ${{ github.workspace }}/upstream

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "::error::缺少 KEYSTORE_B64。请按 docs/release.md 配置 4 个仓库 Secret 后重跑。"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch upstream build system
        run: |
          git init "$UPSTREAM_DIR"
          cd "$UPSTREAM_DIR"
          git remote add origin "$UPSTREAM_REPO"
          git fetch --depth 1 origin "$UPSTREAM_SHA"
          git checkout FETCH_HEAD

      - name: Overlay our source modules
        run: |
          cp -R src/. "$UPSTREAM_DIR/src/"
          python3 - <<'PY'
          import os, re
          p = os.path.join(os.environ["UPSTREAM_DIR"], "settings.gradle.kts")
          s = open(p, encoding="utf-8").read()
          modules = sorted(
              f"src:{lang}:{mod}"
              for lang in os.listdir("src")
              for mod in os.listdir(os.path.join("src", lang))
              if os.path.isdir(os.path.join("src", lang, mod))
          )
          includes = "\n".join(f'include("{m}")' for m in modules)
          s = s.replace("loadAllIndividualExtensions()", f"// loadAllIndividualExtensions()\n{includes}", 1)
          open(p, "w", encoding="utf-8").write(s)
          print(modules)
          PY
          echo "sdk.dir=$ANDROID_HOME" > "$UPSTREAM_DIR/local.properties"

      - name: Restore signing key
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$UPSTREAM_DIR/signingkey.jks"

      - name: Build release APKs
        working-directory: ${{ env.UPSTREAM_DIR }}
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          TASKS=$(ls -d src/*/* | sed 's|/|:|g;s|^|:|' | sed 's|$|:assembleRelease|' | tr '\n' ' ')
          echo "tasks: $TASKS"
          ./gradlew $TASKS --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.UPSTREAM_DIR }}/build.log
          if-no-files-found: ignore

      - name: Verify APK signature
        run: |
          APK=$(find "$UPSTREAM_DIR/src" -path "*/outputs/apk/release/*.apk" | head -1)
          echo "APK=$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs -v "$APK"

      - name: Generate repository index
        run: |
          FINGERPRINT=$(keytool -list -v -keystore "$UPSTREAM_DIR/signingkey.jks" \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}" -alias "${{ secrets.ALIAS }}" \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "fingerprint=$FINGERPRINT"
          python3 scripts/build_repo.py --upstream "$UPSTREAM_DIR" --out repo --fingerprint "$FINGERPRINT"
          cat repo/index.min.json

      - uses: actions/upload-artifact@v4
        with:
          name: extension-repo
          path: repo/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "chore: publish extension repo"

      - name: Attach APKs to a release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: repo/apk/*.apk
          generate_release_notes: false
